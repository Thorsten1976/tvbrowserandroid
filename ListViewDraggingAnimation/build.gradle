apply plugin: 'com.android.library'

android {

    namespace 'com.example.android.listviewdragginganimation'

    compileSdk 33
    defaultConfig {
        minSdk 16
        //noinspection OldTargetApi
        targetSdk 33
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {}
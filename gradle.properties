# https://docs.gradle.org/current/userguide/build_environment.html
#org.gradle.jvmargs=-Xmx2048m
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g

android.debug.obsoleteApi=true
#android.enableD8=true
#android.enableR8=true
#android.enableJetifier=true
android.nonTransitiveRClass=true
android.useAndroidX=true

# https://docs.gradle.org/5.1.1/userguide/build_environment.html#sec:gradle_configuration_properties
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.unsafe.configuration-cache=true
org.gradle.unsafe.configuration-cache-problems=warn
org.gradle.warning.mode=all

AndroidProject.signing=../../AndroidSecurity/tvbrowserandroidproject.properties